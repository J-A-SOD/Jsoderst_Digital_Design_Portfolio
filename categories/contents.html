
<!DOCTYPE html>
<html>
<head>
  <title>Projects</title>
  <link rel="stylesheet" href="contents_style.css">
</head>

<body>

  <!-- FILTER UI -->
  <div class="projects-header">
    <button id="clear-filter">Show All</button>
    <span id="active-filter"></span>
  </div>

  <!-- PROJECT GRID -->
  
  <div class="filter-bar">

    <div class="dropdown">
      <button id="dropdown-toggle">Filter</button>

      <div id="dropdown-menu" class="dropdown-menu">
        <label><input type="checkbox" value="digital"> Digital</label>
        <label><input type="checkbox" value="photography"> Photography</label>
        <label><input type="checkbox" value="music"> Music</label>
        <label><input type="checkbox" value="architecture"> Architecture</label>
        <label><input type="checkbox" value="interactive"> Interactive</label>
      </div>
    </div>

  </div>


  <script src="contents.js"></script>

</body>
</html>
